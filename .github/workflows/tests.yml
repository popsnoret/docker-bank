
name: Tester

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passing-level:
    name: Godkänt nivå
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank
          MYSQL_USER: bank_app
          MYSQL_PASSWORD: bank_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kontrollera projektstruktur
        shell: bash
        run: |
          test -f frontend/package.json || {
            echo "::error::frontend/package.json saknas. Skapa Next.js-projektet i mappen frontend."
            exit 1
          }
          test -f frontend/package-lock.json || {
            echo "::error::frontend/package-lock.json saknas. Projektet ska använda npm."
            exit 1
          }
          test -f backend/package.json || {
            echo "::error::backend/package.json saknas. Skapa Express-projektet i mappen backend."
            exit 1
          }
          test -f backend/package-lock.json || {
            echo "::error::backend/package-lock.json saknas. Projektet ska använda npm."
            exit 1
          }

      - name: Installera frontend
        run: npm ci --prefix frontend

      - name: Installera backend
        run: npm ci --prefix backend

      - name: Skapa databastabeller
        run: docker exec -i $(docker ps -q --filter ancestor=mysql:8.4) mysql -ubank_app -pbank_password bank < database/init.sql

      - name: Installera tester
        run: npm ci --prefix tests

      - name: Installera Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Bygg frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: npm run build --prefix frontend

      - name: Kör tester
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: bank_app
          DB_PASSWORD: bank_password
          DB_NAME: bank
        run: npm test --prefix tests
        
